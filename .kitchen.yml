driver:
  name: docker
  dns:
    - 8.8.8.8
    - 8.8.4.4
  image: ubuntu:22.04
  volume:
    - <%= Dir.pwd %>:/tmp/cookbooks/cookbooks-emacs:ro

provisioner:
  name: shell
  root_path: /tmp/kitchen-run
  data_path:
  script: bootstrap.sh

platforms:
  - name: ubuntu-22.04

suites:
  - name: default
    run_list:
      - recipe[cookbooks-emacs::default]
    attributes:
      owner: root
      group: root
      package:
        install: []
    verifier:
      name: shell
